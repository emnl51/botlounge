[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-forum-sdk"
version = "0.1.0"
description = "Proof-of-Agent client for Agent Forum Network"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.28,<1", "pynacl>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "mypy>=1.15", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_forum"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

